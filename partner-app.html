<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет партнёра NIK SHEN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Тема берётся у Telegram. Вне Telegram (например, если партнёр откроет ссылку
   в обычном браузере) переменные пустые, поэтому у каждой есть свой запасной цвет. */
:root{
  --bg: var(--tg-theme-bg-color, #0E212C);
  --card: var(--tg-theme-secondary-bg-color, #132B38);
  --ink: var(--tg-theme-text-color, #E6F3F9);
  --hint: var(--tg-theme-hint-color, #93B3C3);
  --accent: var(--tg-theme-link-color, #38BDF0);
  --btn: var(--tg-theme-button-color, #38BDF0);
  --btn-ink: var(--tg-theme-button-text-color, #06222F);
  --good:#4FD292; --warn:#FF8F5C;
  --line: color-mix(in srgb, var(--hint) 22%, transparent);
}
@media (prefers-color-scheme: light){
  :root{ --bg: var(--tg-theme-bg-color, #FFFFFF); --card: var(--tg-theme-secondary-bg-color, #F1F6F9);
         --ink: var(--tg-theme-text-color, #0A1B24); --hint: var(--tg-theme-hint-color, #5C7885);
         --accent: var(--tg-theme-link-color, #0A78A9); --btn: var(--tg-theme-button-color, #0A78A9);
         --btn-ink: var(--tg-theme-button-text-color, #FFFFFF); --good:#1F7A4D; --warn:#A8441A; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     padding:14px 14px calc(24px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;line-height:1.45}

header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:700}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--card);
      color:var(--hint);font-size:.76rem;font-weight:600}
.chip.code{color:var(--accent);letter-spacing:.04em}

.hero{background:var(--card);border-radius:16px;padding:18px;margin-bottom:10px}
.hero .label{color:var(--hint);font-size:.8rem}
.hero .sum{font-size:2.3rem;font-weight:800;margin:2px 0 4px;letter-spacing:-.02em}
.hero .due{color:var(--hint);font-size:.86rem}
.hero.debt .sum{color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center;min-width:0}
.tile b{display:block;font-size:1.25rem;font-weight:700}
.tile span{display:block;color:var(--hint);font-size:.72rem;margin-top:2px;line-height:1.3}

nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 1 auto;border:0;border-radius:999px;padding:8px 10px;background:var(--card);
           color:var(--hint);font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}

section{display:none}
section.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
     background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:7px}
.row .l{min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .d{color:var(--hint);font-size:.78rem;margin-top:2px}
.row .a{font-weight:700;white-space:nowrap}
.st{font-size:.72rem;color:var(--hint)}
.st.wait{color:var(--accent)} .st.paid{color:var(--good)}
.stale{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.86rem;color:var(--accent)}
.hint{color:var(--hint);font-size:.82rem}
td.n.wait{color:var(--accent)} td.n.paid{color:var(--good)}

.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px}
.card h3{font-size:.95rem;margin-bottom:6px}
.card p{margin:0;color:var(--hint);font-size:.88rem}
.card .val{margin:8px 0 10px;padding:10px;border-radius:10px;background:var(--bg);
           font-size:.78rem;word-break:break-all}
.copy{width:100%;border:0;border-radius:10px;padding:11px;background:var(--btn);color:var(--btn-ink);
      font-size:.9rem;font-weight:700;cursor:pointer}
.copy.done{background:var(--good);color:#04231A}

details{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--hint)}
details[open] summary::after{content:"−"}
details .body{margin:10px 0;font-size:.88rem}
details .body p{margin:0 0 8px;color:var(--hint);white-space:pre-wrap}
details .body .say{margin:0 0 6px;padding:8px 11px;border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;background:var(--bg);color:var(--ink)}

.lede{color:var(--hint);font-size:.88rem;margin:0 0 12px}
.rule{display:flex;gap:10px;background:var(--card);border-radius:14px;padding:13px;margin-bottom:7px}
.rule .ic{font-size:1.1rem;line-height:1.3}
.rule b{display:block;margin-bottom:3px;font-size:.92rem}
.rule p{margin:0;color:var(--hint);font-size:.86rem}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
h3.sub{margin:18px 0 8px;font-size:15px}
td{padding:10px 13px;font-size:.88rem;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-weight:700;white-space:nowrap}
.note{background:var(--card);border-radius:14px;padding:14px;color:var(--hint);font-size:.86rem;margin-top:10px}
.note p{margin:6px 0 0} .note b{display:block;margin-bottom:4px;color:var(--ink)}
.lede p{margin:0 0 8px}
.er{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:.87rem;color:var(--hint)}
.er b{font-weight:600;color:var(--ink)}
.er.minus b{color:var(--warn)}
.er.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;color:var(--ink);font-weight:600}
.er.you b{color:var(--good);font-size:1.05rem}
.card ul.plain{margin:6px 0 10px;padding-left:18px;color:var(--hint);font-size:.88rem}
.card h3 .chip{font-size:.7rem;padding:2px 7px;background:var(--bg)}
.foot{margin-top:16px}
.foot button{width:100%;border:0;border-radius:12px;padding:13px;background:var(--card);
             color:var(--accent);font-size:.92rem;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:40px 16px;color:var(--hint)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"><div class="empty"><b>Кабинет открывается из бота</b>
Зайди в @NIKSHEN_BOT, команда /me, и нажми «Открыть кабинет страницей».
<div id="diag" style="margin-top:18px;font-size:.72rem;opacity:.5;word-break:break-all"></div></div></div>

<script>
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function money(v){ return (v < 0 ? "−" : "") + Math.abs(v).toLocaleString("ru-RU") + " ₽"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* Данные кладёт бот, когда рисует кнопку: он и так знает, кто перед ним.

   ⚠️ Раньше они лежали во фрагменте адреса, после решётки. Не сработало на живом
   телефоне: Telegram передаёт через фрагмент СВОИ параметры (tgWebAppData, тема,
   версия, платформа) и наш блок туда не доезжает. Поэтому основное место теперь
   параметр запроса, а чтение фрагмента оставлено запасным путём. */
function decodePayload(raw){
  if (!raw) return null;
  try {
    var b = atob(decodeURIComponent(raw).replace(/-/g, "+").replace(/_/g, "/"));
    var bytes = Uint8Array.from(b, function(c){ return c.charCodeAt(0); });
    var data = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    return (data && data.v) ? data : null;
  } catch (e) { return null; }
}

function readData(){
  var fromQuery = decodePayload(new URLSearchParams(location.search).get("d"));
  if (fromQuery) return fromQuery;
  var h = location.hash.slice(1);
  if (!h) return null;
  // Во фрагменте наш блок может лежать как «d=...» среди параметров Telegram
  // или отдельной строкой, если Telegram ничего не добавил.
  var byKey = decodePayload(new URLSearchParams(h).get("d"));
  if (byKey) return byKey;
  return decodePayload(h.split("&")[0]);
}

function copy(text, btn){
  var done = function(){
    var was = btn.textContent;
    btn.textContent = "Скопировано";
    btn.classList.add("done");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    setTimeout(function(){ btn.textContent = was; btn.classList.remove("done"); }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
  } else { fallback(text, done); }
}
function fallback(text, done){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function render(d){
  var st = d.st;
  var heroLabel = "К выплате", heroSum = money(st.pend), heroDue = d.due, debt = false;
  if (st.pend < 0) { heroLabel = "За тобой после возврата"; heroSum = money(-st.pend); debt = true;
    heroDue = "Спишется со следующих продаж"; }
  else if (st.pend === 0 && st.cnt === 0) { heroDue = "Первая продажа ещё впереди"; }

  var h = '<header><h1>Кабинет партнёра</h1>'
        + '<span class="chip code">' + esc(d.code) + '</span>'
        + '<span class="chip">скидка ' + st_disc(d) + '</span></header>'
        + ((d.v || 1) < 2
            ? '<div class="stale">Кабинет открыт по старой ссылке, часть цифр может '
              + 'не показаться. Открой его заново кнопкой в боте.</div>'
            : "")
        + '<div class="hero' + (debt ? " debt" : "") + '"><div class="label">' + heroLabel + '</div>'
        + '<div class="sum mono">' + heroSum + '</div><div class="due">' + esc(heroDue) + '</div></div>'
        + '<div class="grid">'
        + tile(st.mcnt, "покупок в " + d.month, money(st.maccr))
        + tile(st.cnt, "покупок за всё время", money(st.accr))
        + tile(st.ref, "перешло по ссылке", st.paid ? "выплачено " + money(st.paid) : "")
        + '</div>'
        + '<nav>' + tab("sales", "Продажи") + tab("team", "Моя команда") + tab("bonus", "Бонусы")
        + tab("econ", "Из чего цена") + tab("links", "Ссылки") + '</nav>'
        + '<section id="s-sales" class="on">' + salesHtml(d) + '</section>'
        + '<section id="s-team">' + teamHtml(d) + '</section>'
        + '<section id="s-bonus">' + bonusHtml(d) + '</section>'
        + '<section id="s-econ">' + econHtml(d) + '</section>'
        + '<section id="s-links">' + linksHtml(d) + '</section>'
        + '<div class="foot"><button id="ask">Написать Никите</button></div>';
  document.getElementById("app").innerHTML = h;

  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll("nav button").forEach(function(x){ x.setAttribute("aria-selected", "false"); });
      document.querySelectorAll("section").forEach(function(x){ x.classList.remove("on"); });
      b.setAttribute("aria-selected", "true");
      document.getElementById("s-" + b.dataset.k).classList.add("on");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    };
  });
  document.querySelectorAll("[data-copy]").forEach(function(b){
    b.onclick = function(){ copy(b.dataset.copy, b); };
  });
  document.getElementById("ask").onclick = function(){
    if (tg && tg.openTelegramLink) tg.openTelegramLink(d.contact);
    else location.href = d.contact;
  };
}
function st_disc(d){ return d.disc ? d.disc + "%" : "нет"; }
function tile(big, small, extra){
  return '<div class="tile"><b class="mono">' + big + '</b><span>' + esc(small)
       + (extra ? "<br>" + esc(extra) : "") + '</span></div>';
}
function tab(k, title){
  return '<button data-k="' + k + '" aria-selected="' + (k === "sales") + '">' + title + '</button>';
}
function salesHtml(d){
  if (!d.sales.length) return '<div class="note">' + esc(d.empty) + '</div>' + rulesHtml(d);
  var rows = d.sales.map(function(s){
    var cls = s.s === "выплачено" ? "paid" : (s.s === "ожидает" ? "wait" : "");
    return '<div class="row"><div class="l"><div class="t">' + esc(s.t) + '</div>'
         + '<div class="d">' + esc(s.d) + ' · <span class="st ' + cls + '">' + esc(s.s) + '</span></div></div>'
         + '<div class="a mono">' + money(s.a) + '</div></div>';
  }).join("");
  return rows + '<div class="note">Показаны последние ' + d.sales.length
       + '. Кто именно купил, не показывается никому: это персональные данные клиента.</div>'
       + rulesHtml(d);
}

// Из вкладки «Условия» осталось одно правило — привязка. Владелец убрал вкладку
// 03.09.2026 и попросил перенести этот текст сюда, к продажам.
function rulesHtml(d){
  if (!d.rules || !d.rules.length) return "";
  return d.rules.map(function(r){
    return '<div class="rule"><div class="ic">' + r[0] + '</div><div><b>' + esc(r[1]) + '</b>'
         + '<p>' + esc(r[2]) + '</p></div></div>';
  }).join("");
}
function linksHtml(d){
  var cards = d.links.map(function(l){
    return '<div class="card"><h3>' + esc(l[0]) + '</h3><div class="val code">' + esc(l[1]) + '</div>'
         + '<button class="copy" data-copy="' + esc(l[1]) + '">Скопировать ссылку</button></div>';
  }).join("");
  return cards
       + '<div class="card"><h3>Промокод словами</h3><div class="val code">' + esc(d.name) + '</div>'
       + '<button class="copy" data-copy="' + esc(d.name) + '">Скопировать код</button></div>'
       + '<div class="note">Ссылка сама включает скидку и привязывает человека к тебе. '
       + 'Пришёл без ссылки — пусть введёт код в боте, засчитается так же.</div>';
}
function teamHtml(d){
  // Ссылка на кабинет живёт внутри старого сообщения, и в ней может не быть новых
  // полей. Без значений по умолчанию экран печатал «undefined%».
  var t = d.team || {}, h = "";
  var pct = t.pct == null ? 25 : t.pct, share = t.share == null ? 50 : t.share;
  h += '<div class="card"><h3>' + pct + '% с каждой продажи тех, кого ты привёл</h3>'
     + '<p>Приводишь блогера в программу, и с каждой его продажи тебе идёт ' + pct
     + '% чистой прибыли. Из моей доли, не из его: он получает свои ' + share
     + '% полностью, ровно столько же, сколько получал бы без тебя.</p>'
     + '<p>Чистая с продажи делится натрое: половина ему, четверть тебе, четверть мне. '
     + 'Ограничения по числу приведённых нет, срока у выплат тоже нет: он продаёт — тебе идёт.</p></div>';

  h += '<div class="card"><h3>Как привести</h3>'
     + '<p>Скажи мне, кого приводишь. Я заведу ему код и пропишу, что он твой. '
     + 'С этого момента все его продажи попадают сюда автоматически.</p></div>';

  if (t.people && t.people.length) {
    h += '<h3 class="sub">Кого ты привёл</h3><div class="card" style="padding:0;overflow:hidden"><table>'
       + t.people.map(function(p){
           return '<tr><td>' + esc(p.n) + '<br><span class="hint">' + p.cnt + ' '
                + plural(p.cnt, "продажа", "продажи", "продаж") + '</span></td>'
                + '<td class="n mono">' + money(p.sum) + '</td></tr>';
         }).join("") + '</table></div>';
  } else {
    h += '<div class="note">Ты пока никого не привёл. Как только приведёшь, здесь появится '
       + 'он сам, его продажи и что тебе с них пришло.</div>';
  }

  if (t.rows && t.rows.length) {
    h += '<h3 class="sub">Продажи твоей команды</h3><div class="card" style="padding:0;overflow:hidden"><table>'
       + t.rows.map(function(r){
           var cls = r.s === "выплачено" ? "paid" : "wait";
           return '<tr><td>' + esc(r.d) + ' · ' + esc(r.t) + '<br><span class="hint">'
                + esc(r.w) + ' · ' + esc(r.s) + '</span></td>'
                + '<td class="n mono ' + cls + '">' + money(r.a) + '</td></tr>';
         }).join("") + '</table></div>'
       + '<div class="note">Каждая строка — продажа, по которой тебе начислено. '
       + 'Имён покупателей здесь нет и не будет: это чужие данные.</div>';
  }

  if (t.payouts && t.payouts.length) {
    h += '<h3 class="sub">Сколько тебе идёт с продажи по сегодняшним ценам</h3>'
       + '<div class="card" style="padding:0;overflow:hidden"><table>'
       + t.payouts.map(function(r){
           return '<tr><td>' + esc(r[0]) + '</td><td class="n mono">' + money(r[1]) + '</td></tr>';
         }).join("") + '</table></div>'
       + '<div class="note">Это срез на сегодня, а не прайс. Платим процент, поэтому подниму '
       + 'цены или добавлю продукт дороже — суммы в этой таблице вырастут сами.</div>';
  }
  return h;
}

function plural(n, one, few, many){
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function bonusHtml(d){
  var b = d.bonus || {};
  if (b.disc == null) b.disc = 50;
  var rows = (b.items || []).map(function(i){
    return '<tr><td>' + esc(i[0]) + '</td><td class="n mono">' + i[1] + '⭐ → <b>' + i[2] + '⭐</b></td></tr>';
  }).join("");
  var h = '<div class="card"><h3>Скидка ' + b.disc + '% на ассистентов для себя</h3>'
        + '<p>Заходишь в бота с этого же телеграма, цена уже уменьшена. '
        + 'Вводить ничего не надо.</p></div>'
        + '<div class="card" style="padding:0;overflow:hidden"><table>' + rows + '</table></div>'
        + '<div class="card"><h3>Скидка ' + b.disc + '% на разборы по дате рождения</h3>'
        + '<p>Работает так же: заходишь в бота-нумеролога, цена уже уменьшена.</p></div>';
  return h + '<div class="note">Рассказывать про то, чем не пользуешься, тяжело и заметно, '
       + 'поэтому у тебя есть твоя партнёрская скидка ' + b.disc + '% на продукты, '
       + 'которые ты продаёшь.</div>';
}


function econHtml(d){
  var rows = d.econ.map(function(e){
    var lines = [
      ["платит клиент", e[2], ""],
      ["комиссия Telegram", -e[3], "minus"],
      ["налог 4%", -e[4], "minus"]
    ];
    if (e[5]) lines.push(["вызовы модели", -e[5], "minus"]);
    lines.push(["сервер, подписки, домен", -e[6], "minus"]);
    var body = lines.map(function(l){
      return '<div class="er ' + l[2] + '"><span>' + esc(l[0]) + '</span><b class="mono">'
           + money(l[1]) + '</b></div>';
    }).join("");
    return '<div class="card"><h3>' + esc(e[0]) + ' <span class="chip">' + e[1] + '⭐</span></h3>'
         + body
         + '<div class="er total"><span>чистая прибыль</span><b class="mono">' + money(e[7]) + '</b></div>'
         + '<div class="er you"><span>тебе, 50%</span><b class="mono">' + money(e[8]) + '</b></div>'
         + '<div class="er"><span>тому, кто тебя привёл, 25%</span><b class="mono">'
         + money(e[10] || 0) + '</b></div>'
         + '<div class="er"><span>мне</span><b class="mono">' + money(e[9]) + '</b></div></div>';
  }).join("");
