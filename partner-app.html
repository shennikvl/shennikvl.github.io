<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет партнёра NIK SHEN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Голубой стеклянный стиль (решение владельца 06.09.2026): свой брендовый фон и
   стекло вместо слепого наследования цветов Telegram — иначе у части партнёров
   тема была бы серой/чёрной вместо фирменного голубого. tg.ready()/expand() и
   нативные жесты остаются, просто фон и карточки теперь всегда наши. */
:root{
  --bg-1:#071626; --bg-2:#0B2A47; --bg-3:#082036;
  --card: rgba(255,255,255,.07);
  --card-line: rgba(255,255,255,.12);
  --ink:#EAF5FC; --hint:#96BBD1;
  --accent:#4DD0FA; --accent-2:#0A78A9;
  --btn-ink:#04202E;
  --good:#4FD292; --warn:#FF9166;
  --line: rgba(255,255,255,.12);
  --glass-shadow: 0 10px 34px rgba(2,12,24,.35);
  --blob-1: rgba(56,189,240,.35); --blob-2: rgba(10,120,169,.30); --blob-3: rgba(120,90,255,.16);
}
@media (prefers-color-scheme: light){
  :root{
    --bg-1:#EAF6FF; --bg-2:#DCEEFC; --bg-3:#F3FAFF;
    --card: rgba(255,255,255,.55);
    --card-line: rgba(255,255,255,.75);
    --ink:#0B2333; --hint:#4E7690;
    --accent:#0A78A9; --accent-2:#0EA5E9;
    --btn-ink:#FFFFFF;
    --good:#1F7A4D; --warn:#B24A1E;
    --line: rgba(20,70,100,.12);
    --glass-shadow: 0 10px 30px rgba(20,90,130,.10);
    --blob-1: rgba(56,189,240,.35); --blob-2: rgba(14,165,233,.25); --blob-3: rgba(160,140,255,.18);
  }
}
*{box-sizing:border-box}
html{background:var(--bg-1)}
body{margin:0;min-height:100vh;color:var(--ink);position:relative;isolation:isolate;
     background:linear-gradient(165deg,var(--bg-1) 0%,var(--bg-2) 48%,var(--bg-3) 100%);
     font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     padding:14px 14px calc(24px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
/* Размытые цветные пятна за стеклом — без них blur на карточках нечего было бы
   размывать, и «стекло» выглядело бы просто полупрозрачным серым. */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);pointer-events:none}
body::before{width:60vw;height:60vw;max-width:520px;max-height:520px;top:-18vw;right:-14vw;
             background:radial-gradient(circle at 30% 30%,var(--blob-1),transparent 70%)}
body::after{width:70vw;height:70vw;max-width:600px;max-height:600px;bottom:-22vw;left:-18vw;
            background:radial-gradient(circle at 60% 60%,var(--blob-2),transparent 70%)}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;line-height:1.45}

header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:700}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--card);
      backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
      border:1px solid var(--card-line);color:var(--hint);font-size:.76rem;font-weight:600}
.chip.code{color:var(--accent);letter-spacing:.04em}

.hero{background:var(--card);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:20px;padding:20px;margin-bottom:10px}
.hero .label{color:var(--hint);font-size:.8rem}
.hero .sum{font-size:2.3rem;font-weight:800;margin:2px 0 4px;letter-spacing:-.02em;
           background:linear-gradient(100deg,var(--ink),var(--accent));-webkit-background-clip:text;
           background-clip:text;-webkit-text-fill-color:transparent}
.hero .due{color:var(--hint);font-size:.86rem}
.hero.debt .sum{background:none;-webkit-text-fill-color:var(--warn);color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--card);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:16px;padding:12px 10px;text-align:center;min-width:0}
.tile b{display:block;font-size:1.25rem;font-weight:700}
.tile span{display:block;color:var(--hint);font-size:.72rem;margin-top:2px;line-height:1.3}

nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 1 auto;border:1px solid var(--card-line);border-radius:999px;padding:8px 10px;
           background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
           color:var(--hint);font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap;
           transition:background .15s ease,color .15s ease}
nav button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));
           color:var(--btn-ink);border-color:transparent;box-shadow:0 4px 16px rgba(56,189,240,.35)}

section{display:none}
section.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
     background:var(--card);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
     border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
     border-radius:14px;padding:12px 14px;margin-bottom:7px}
.row .l{min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .d{color:var(--hint);font-size:.78rem;margin-top:2px}
.row .a{font-weight:700;white-space:nowrap}
.st{font-size:.72rem;color:var(--hint)}
.st.wait{color:var(--accent)} .st.paid{color:var(--good)}
.stale{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       border:1px solid var(--card-line);border-radius:12px;padding:10px 12px;margin:0 0 12px;
       font-size:.86rem;color:var(--accent)}
.hint{color:var(--hint);font-size:.82rem}
td.n.wait{color:var(--accent)} td.n.paid{color:var(--good)}

.card{background:var(--card);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:16px;padding:14px;margin-bottom:8px}
.card h3{font-size:.95rem;margin-bottom:6px}
.card p{margin:0;color:var(--hint);font-size:.88rem}
.card .val{margin:8px 0 10px;padding:10px;border-radius:10px;background:rgba(0,0,0,.16);
           border:1px solid var(--card-line);font-size:.78rem;word-break:break-all}
@media (prefers-color-scheme: light){ .card .val{background:rgba(255,255,255,.5)} }
.copy{width:100%;border:0;border-radius:12px;padding:11px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--btn-ink);
      font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(56,189,240,.3)}
.copy.done{background:var(--good);color:#04231A;box-shadow:none}

details{background:var(--card);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
        border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
        border-radius:16px;padding:12px 14px;margin-bottom:8px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--hint)}
details[open] summary::after{content:"−"}
details .body{margin:10px 0;font-size:.88rem}
details .body p{margin:0 0 8px;color:var(--hint);white-space:pre-wrap}
details .body .say{margin:0 0 6px;padding:8px 11px;border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;background:rgba(0,0,0,.14);color:var(--ink)}

.lede{color:var(--hint);font-size:.88rem;margin:0 0 12px}
.rule{display:flex;gap:10px;background:var(--card);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:16px;padding:13px;margin-bottom:7px}
.rule .ic{font-size:1.1rem;line-height:1.3}
.rule b{display:block;margin-bottom:3px;font-size:.92rem}
.rule p{margin:0;color:var(--hint);font-size:.86rem}
table{width:100%;border-collapse:collapse;background:var(--card);backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--card-line);
      box-shadow:var(--glass-shadow);border-radius:16px;overflow:hidden}
h3.sub{margin:18px 0 8px;font-size:15px}
td{padding:10px 13px;font-size:.88rem;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-weight:700;white-space:nowrap}
.note{background:var(--card);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:16px;padding:14px;color:var(--hint);font-size:.86rem;margin-top:10px}
.note p{margin:6px 0 0} .note b{display:block;margin-bottom:4px;color:var(--ink)}
.lede p{margin:0 0 8px}
.er{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;font-size:.87rem;color:var(--hint)}
.er>span{min-width:0}
.er b{font-weight:600;color:var(--ink);white-space:nowrap;flex-shrink:0}
.er.minus b{color:var(--warn)}
.er.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;color:var(--ink);font-weight:600}
.er.you b{color:var(--good);font-size:1.05rem}
.card ul.plain{margin:6px 0 10px;padding-left:18px;color:var(--hint);font-size:.88rem}
.card h3 .chip{font-size:.7rem;padding:2px 7px;background:rgba(0,0,0,.16);border-color:var(--card-line)}
.foot{margin-top:16px}
.foot button{width:100%;border:1px solid var(--card-line);border-radius:14px;padding:13px;
             background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
             color:var(--accent);font-size:.92rem;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:40px 16px;color:var(--hint)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"><div class="empty"><b>Кабинет открывается из бота</b>
Зайди в @NIKSHEN_BOT, команда /me, и нажми «Открыть кабинет страницей».
<div id="diag" style="margin-top:18px;font-size:.72rem;opacity:.5;word-break:break-all"></div></div></div>

<script>
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function money(v){ return (v < 0 ? "−" : "") + Math.abs(v).toLocaleString("ru-RU") + " ₽"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* Данные кладёт бот, когда рисует кнопку: он и так знает, кто перед ним.

   ⚠️ Раньше они лежали во фрагменте адреса, после решётки. Не сработало на живом
   телефоне: Telegram передаёт через фрагмент СВОИ параметры (tgWebAppData, тема,
   версия, платформа) и наш блок туда не доезжает. Поэтому основное место теперь
   параметр запроса, а чтение фрагмента оставлено запасным путём. */
function decodePayload(raw){
  if (!raw) return null;
  try {
    var b = atob(decodeURIComponent(raw).replace(/-/g, "+").replace(/_/g, "/"));
    var bytes = Uint8Array.from(b, function(c){ return c.charCodeAt(0); });
    var data = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    return (data && data.v) ? data : null;
  } catch (e) { return null; }
}

function readData(){
  var fromQuery = decodePayload(new URLSearchParams(location.search).get("d"));
  if (fromQuery) return fromQuery;
  var h = location.hash.slice(1);
  if (!h) return null;
  // Во фрагменте наш блок может лежать как «d=...» среди параметров Telegram
  // или отдельной строкой, если Telegram ничего не добавил.
  var byKey = decodePayload(new URLSearchParams(h).get("d"));
  if (byKey) return byKey;
  return decodePayload(h.split("&")[0]);
}

function copy(text, btn){
  var done = function(){
    var was = btn.textContent;
    btn.textContent = "Скопировано";
    btn.classList.add("done");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    setTimeout(function(){ btn.textContent = was; btn.classList.remove("done"); }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
  } else { fallback(text, done); }
}
function fallback(text, done){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function render(d){
  var st = d.st;
  // ⚠️ v3 (08.09.2026): due — объект {fast, slow}, не строка. Звёзды бота-нумеролога
  // держит Fragment 21 день до вывода в TON — это ограничение Telegram, не наше,
  // отдельный, более поздний срок от Tribute/услуг. Ссылки до этой правки несут
  // d.due строкой и без pend_fast/pend_slow — ниже поддержаны оба случая, чтобы
  // старая ссылка не падала, а показывала баннер «открой заново».
  function dueText(due, fast, slow){
    if (typeof due === "string") return due;
    if (fast > 0 && slow > 0) return due.fast + " · ассистенты, " + due.slow + " · разборы";
    if (slow > 0) return due.slow + " (разборы — у звёзд обязательная выдержка 21 день)";
    return due.fast;
  }
  var heroLabel = "К выплате", heroSum = money(st.pend),
      heroDue = dueText(d.due, st.pend_fast || 0, st.pend_slow || 0), debt = false;
  if (st.pend < 0) { heroLabel = "За тобой после возврата"; heroSum = money(-st.pend); debt = true;
    heroDue = "Спишется со следующих продаж"; }
  else if (st.pend === 0 && st.cnt === 0) { heroDue = "Первая продажа ещё впереди"; }

  var h = '<header><h1>Кабинет партнёра</h1>'
        + '<span class="chip code">' + esc(d.code) + '</span>'
        + '<span class="chip">скидка ' + st_disc(d) + '</span></header>'
        + ((d.v || 1) < 3
            ? '<div class="stale">Кабинет открыт по старой ссылке, часть цифр может '
              + 'не показаться. Открой его заново кнопкой в боте.</div>'
            : "")
        + '<div class="hero' + (debt ? " debt" : "") + '"><div class="label">' + heroLabel + '</div>'
        + '<div class="sum mono">' + heroSum + '</div><div class="due">' + esc(heroDue) + '</div></div>'
        + '<div class="grid">'
        + tile(st.mcnt, "покупок в " + d.month, money(st.maccr))
        + tile(st.cnt, "покупок за всё время", money(st.accr))
        + tile(st.ref, "перешло по ссылке", st.paid ? "выплачено " + money(st.paid) : "")
        + '</div>'
        + '<nav>' + tab("sales", "Продажи") + tab("team", "Моя команда") + tab("bonus", "Бонусы")
        + tab("econ", "Мотивация") + tab("links", "Ссылки") + '</nav>'
        + '<section id="s-sales" class="on">' + salesHtml(d) + '</section>'
        + '<section id="s-team">' + teamHtml(d) + '</section>'
        + '<section id="s-bonus">' + bonusHtml(d) + '</section>'
        + '<section id="s-econ">' + econHtml(d) + '</section>'
        + '<section id="s-links">' + linksHtml(d) + '</section>'
        + '<div class="foot"><button id="ask">Написать Нику</button></div>';
  document.getElementById("app").innerHTML = h;

  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll("nav button").forEach(function(x){ x.setAttribute("aria-selected", "false"); });
      document.querySelectorAll("section").forEach(function(x){ x.classList.remove("on"); });
      b.setAttribute("aria-selected", "true");
      document.getElementById("s-" + b.dataset.k).classList.add("on");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    };
  });
  document.querySelectorAll("[data-copy]").forEach(function(b){
    b.onclick = function(){ copy(b.dataset.copy, b); };
  });
  document.getElementById("ask").onclick = function(){
    if (tg && tg.openTelegramLink) tg.openTelegramLink(d.contact);
    else location.href = d.contact;
  };
}
function st_disc(d){ return d.disc ? d.disc + "%" : "нет"; }
function tile(big, small, extra){
  return '<div class="tile"><b class="mono">' + big + '</b><span>' + esc(small)
       + (extra ? "<br>" + esc(extra) : "") + '</span></div>';
}
function tab(k, title){
  return '<button data-k="' + k + '" aria-selected="' + (k === "sales") + '">' + title + '</button>';
}
function salesHtml(d){
  // Привязка переехала во вкладку «Мотивация» 06.09.2026 (седьмая правка того же
  // дня) — это тоже часть мотивации, не только правило про продажи.
  if (!d.sales.length) return '<div class="note">' + esc(d.empty) + '</div>';
  var rows = d.sales.map(function(s){
    var cls = s.s === "выплачено" ? "paid" : (s.s === "ожидает" ? "wait" : "");
    return '<div class="row"><div class="l"><div class="t">' + esc(s.t) + '</div>'
         + '<div class="d">' + esc(s.d) + ' · <span class="st ' + cls + '">' + esc(s.s) + '</span></div></div>'
         + '<div class="a mono">' + money(s.a) + '</div></div>';
  }).join("");
  return rows + '<div class="note">Показаны последние ' + d.sales.length
       + '. Кто именно купил, не показывается никому: это персональные данные клиента.</div>';
}

// Из вкладки «Условия» осталось одно правило — привязка. Владелец убрал вкладку
// 03.09.2026, сначала перенёс текст к продажам, затем 06.09.2026 (седьмая правка
// того же дня) — в «Мотивацию»: закрепление за партнёром это тоже часть того,
// почему ему выгодно приводить людей, а не только сухое правило.
// ⚠️ Фильтруем ЗДЕСЬ, а не только в боте: ссылка на кабинет живёт внутри старого
// сообщения, и в ней может лежать полный список прежних правил. Без фильтра
// они вываливались все разом.
function rulesHtml(d){
  var keep = (d.rules || []).filter(function(r){ return r[1] === "Привязка"; });
  if (!keep.length) return "";
  return keep.map(function(r){
    return '<div class="rule"><div class="ic">' + r[0] + '</div><div><b>' + esc(r[1]) + '</b>'
         + '<p>' + esc(r[2]) + '</p></div></div>';
  }).join("");
}
function linksHtml(d){
  var cards = d.links.map(function(l){
    return '<div class="card"><h3>' + esc(l[0]) + '</h3><div class="val code">' + esc(l[1]) + '</div>'
         + '<button class="copy" data-copy="' + esc(l[1]) + '">Скопировать ссылку</button></div>';
  }).join("");
  return cards
       + '<div class="card"><h3>Промокод словами</h3><div class="val code">' + esc(d.name) + '</div>'
       + '<button class="copy" data-copy="' + esc(d.name) + '">Скопировать код</button></div>'
       + '<div class="note">Ссылка сама включает скидку и привязывает человека к тебе. '
       + 'Пришёл без ссылки — пусть введёт код в боте, засчитается так же.</div>';
}
function teamHtml(d){
  // Ссылка на кабинет живёт внутри старого сообщения, и в ней может не быть новых
  // полей. Без значений по умолчанию экран печатал «undefined%».
  var t = d.team || {}, h = "";
  var pct = t.pct == null ? 10 : t.pct, share = t.share == null ? 50 : t.share;
  h += '<div class="card"><h3>' + pct + '% с каждой продажи тех, кого ты привёл</h3>'
     + '<p>Приводишь человека в программу, и с каждой его продажи тебе идёт ' + pct
     + '% от цены. Он получает свои ' + share + '% полностью.</p>'
     + '<p>Ограничения по числу приведённых нет, срока у выплат тоже нет: он продаёт — тебе идёт.</p></div>';

  h += '<div class="card"><h3>Как привести</h3>'
     + '<p>Скажи мне, кого приводишь. Я заведу ему код и пропишу, что он твой. '
     + 'С этого момента все его продажи попадают сюда автоматически.</p></div>';

  if (t.people && t.people.length) {
    h += '<h3 class="sub">Кого ты привёл</h3><div class="card" style="padding:0;overflow:hidden"><table>'
       + t.people.map(function(p){
           return '<tr><td>' + esc(p.n) + '<br><span class="hint">' + p.cnt + ' '
                + plural(p.cnt, "продажа", "продажи", "продаж") + '</span></td>'
                + '<td class="n mono">' + money(p.sum) + '</td></tr>';
         }).join("") + '</table></div>';
  } else {
    h += '<div class="note">Ты пока никого не привёл. Как только приведёшь, здесь появится '
       + 'он сам, его продажи и что тебе с них пришло.</div>';
  }

  if (t.rows && t.rows.length) {
    h += '<h3 class="sub">Продажи твоей команды</h3><div class="card" style="padding:0;overflow:hidden"><table>'
       + t.rows.map(function(r){
           var cls = r.s === "выплачено" ? "paid" : "wait";
           return '<tr><td>' + esc(r.d) + ' · ' + esc(r.t) + '<br><span class="hint">'
                + esc(r.w) + ' · ' + esc(r.s) + '</span></td>'
                + '<td class="n mono ' + cls + '">' + money(r.a) + '</td></tr>';
         }).join("") + '</table></div>'
       + '<div class="note">Каждая строка — продажа, по которой тебе начислено. '
       + 'Имён покупателей здесь нет и не будет: это чужие данные.</div>';
  }

  // Таблица «сколько тебе идёт по сегодняшним ценам» убрана владельцем 03.09.2026.
  // Не рисуем её, даже если она пришла в данных из ссылки старого сообщения.
  return h;
}

function plural(n, one, few, many){
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function bonusHtml(d){
  // Бонусная система (скидка "для себя" на ассистентов/разборы) убрана владельцем
  // 06.09.2026 вместе со всей идеей отдельной скидки. Вместо неё — честная проверка
  // системы: купи по своей же ссылке, заплати полную цену и тут же получи свою
  // половину назад как обычную продажу. Раньше здесь была карточка про скидку 50%.
  var b = d.bonus || {};
  var share = b.share == null ? 50 : b.share;
  var price = b.tribute_price || 500;
  var half = Math.round(price * share / 100);
  return '<div class="card"><h3>Купи по своей ссылке — проверь систему</h3>'
       + '<p>Решишь взять ассистента себе — переходи по своей же ссылке, а не просто открывай бота. '
       + 'Заплатишь полную цену, ' + price + ' ₽, и тут же увидишь на вкладке «Продажи» начисление '
       + half + ' ₽ — твою обычную половину, потому что купил по своему коду. Никакой отдельной '
       + 'скидки для этого не нужно, деньги просто возвращаются как за любую другую продажу.</p></div>'
       + '<div class="card"><h3>То же самое с разборами</h3>'
       + '<p>Купишь разбор по дате рождения по своему коду в боте-нумерологе — каждая такая '
       + 'оплата тоже вернёт тебе твою половину, как за любую продажу по твоему промокоду.</p></div>'
       + '<div class="card"><h3>По факту это та же скидка 50% — просто по-другому</h3>'
       + '<p>Ты платишь полную стоимость, но половина из неё тут же возвращается тебе начислением. '
       + 'Итог тот же, что и со скидкой в 50%, только устроено честнее: ты сам видишь, что деньги '
       + 'реально пришли, а не просто веришь на слово.</p>'
       + '<p>Это самый простой способ проверить всю систему целиком: купи по своему промокоду и '
       + 'посмотри на вкладку «Продажи» — если начисление появилось сразу, значит всё считается '
       + 'честно и прозрачно, и с продаж по твоему промокоду будет ровно так же.</p></div>'
       + '<div class="note">Твой код просто работает на тебя так же, как на любого, '
       + 'кто пришёл по твоей ссылке.</div>';
}


function econHtml(d){
  // Решение владельца 06.09.2026 (седьмая правка того же дня): «Привязка» переехала
  // сюда из вкладки «Продажи» — это тоже часть мотивации, а не только правило.
  // Разборы теперь полными фразами «за каждый проданный X ты получаешь по Y ₽» —
  // готовыми, не собранными из сырых названий продукта: «Совместимость, Прогноз
  // и Детский разбор» грамматически не клеится с «проданный». Суммы по-прежнему
  // берутся из d.econ (партнёру), фраза фиксированная под три ценовых уровня.
  // ⚠️ 08.09.2026: два срока выплаты, не один — см. dueText() в render() для
  // подробностей про 21-дневную выдержку звёзд у Fragment. d.due строкой — старая
  // ссылка (v<3), тогда оба срока совпадают с тем, что уже показано, без паники.
  var dueFast = (typeof d.due === "string") ? d.due : d.due.fast;
  var dueSlow = (typeof d.due === "string") ? d.due : d.due.slow;
  function assistantsRow(items){
    var groups = [];
    items.forEach(function(e){
      var last = groups[groups.length - 1];
      if (last && last.amount === e[3]) last.names.push(e[0]);
      else groups.push({amount: e[3], names: [e[0]]});
    });
    return groups.map(function(g){
      var names = g.names.length > 1
        ? g.names.slice(0, -1).join(", ") + " и " + g.names[g.names.length - 1]
        : g.names[0];
      return '<div class="er you"><span>' + esc(names) + '</span>'
           + '<b class="mono">по ' + money(g.amount) + '</b></div>';
    }).join("");
  }
  function readingsRows(items){
    // Индексы соответствуют порядку в econ_rows() (bot.py): 0 полный, 1-3 средние
    // (совместимость/прогноз/детский — все по одной цене), 4 лёгкие.
    var full = items[0], mid = items[1], light = items[4];
    if (!full || !mid || !light) return "";
    return '<div class="er you"><span>За каждый проданный полный разбор ты получаешь</span>'
         + '<b class="mono">по ' + money(full[3]) + '</b></div>'
         + '<div class="er you"><span>За каждый проданный разбор совместимости, прогноза '
         + 'и детский разбор ты получаешь</span><b class="mono">по ' + money(mid[3]) + '</b></div>'
         + '<div class="er you"><span>За каждый проданный лёгкий разбор ты получаешь</span>'
         + '<b class="mono">по ' + money(light[3]) + '</b></div>';
  }
  var econ = d.econ || [];
  var assistants = econ.filter(function(e){ return e[4] === "assistant"; });
  var readings = econ.filter(function(e){ return e[4] === "reading"; });
  return '<div class="lede"><p>Ты получаешь ровно 50% со всех своих продаж. '
       + 'Комиссия площадки, налог, сервер и все остальные расходы не влияют на твою мотивацию.</p></div>'
       + rulesHtml(d)
       + '<h3 class="sub">🤖 Ассистенты</h3>'
       + '<p class="lede" style="margin-top:0">Все ассистенты продаются по 500 рублей. '
       + 'С каждой продажи любого из этих ассистентов ты получаешь свою половину. '
       + 'Выплата тебе ' + esc(dueFast) + '.</p>'
       + '<div class="card">' + assistantsRow(assistants) + '</div>'
       + '<h3 class="sub">🔢 Бот-нумеролог</h3>'
       + '<p class="lede" style="margin-top:0">Полный разбор стоит примерно 1 000 ₽, совместимость, '
       + 'прогноз и детский разбор стоят примерно 500 ₽, а лёгкий разбор стоит примерно 100 ₽. '
       + 'С каждой продажи разбора ты получаешь свою половину. Выплата тебе ' + esc(dueSlow) + '.</p>'
       + '<div class="card">' + readingsRows(readings) + '</div>'
       + '<div class="note"><b>Что ты получаешь с услуг от приведённых тобой клиентов</b>'
       + '<p>Консультация со мной стоит 5 000 ₽. По твоей скидке 10% человек платит 4 500 ₽. '
       + 'С каждой такой консультации ты фиксированно получаешь 500 ₽.</p>'
       + '<p>Сайт, бот, автоматизация стоят от 10 000 ₽, по твоей скидке 10% это от 9 000 ₽. '
       + 'Ты фиксированно получаешь 1 000 ₽ за каждого человека, который придёт по твоей ссылке или промокоду.</p></div>';
}


var data = readData();
if (!data) {
  // Показываем, что именно пришло в адресе. Без этого поломку пришлось бы угадывать.
  var d = document.getElementById("diag");
  if (d) d.textContent = "адрес: " + (location.search ? "параметры есть (" + location.search.length
      + " знаков)" : "параметров нет") + " · фрагмент: "
      + (location.hash ? location.hash.slice(1, 60) + "…" : "пуст");
}
if (data) { try { render(data); } catch (e) {
  document.getElementById("app").innerHTML =
    '<div class="empty"><b>Не смог показать данные</b>Открой кабинет из бота заново: /me</div>'; } }
</script>
