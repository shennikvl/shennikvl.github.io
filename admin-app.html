<!doctype html>
<html lang="ru" data-theme="dark">
<!-- Кабинет владельца NIK SHEN. Тот же голубой стеклянный стиль и та же схема,
     что и у site/partner-app.html: страница без бэкенда, бот кладёт свежие
     цифры в параметр адреса при каждом показе (?d=...). Доступ ограничен на
     уровне бота командой /admin (is_owner в bot.py) — у страницы самой нет
     ни базы, ни проверки, прятать ей нечем. Всегда тёмная тема — решение
     владельца 17.09.2026, независимо от настроек устройства. -->
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет владельца NIK SHEN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg-1:#071626; --bg-2:#0B2A47; --bg-3:#082036;
  --card: rgba(255,255,255,.07);
  --card-line: rgba(255,255,255,.12);
  --ink:#EAF5FC; --hint:#96BBD1;
  --accent:#4DD0FA; --accent-2:#0A78A9;
  --btn-ink:#04202E;
  --good:#4FD292; --warn:#FF9166;
  --line: rgba(255,255,255,.12);
  --glass-shadow: 0 10px 34px rgba(2,12,24,.35);
  --blob-1: rgba(56,189,240,.35); --blob-2: rgba(10,120,169,.30); --blob-3: rgba(120,90,255,.16);
}
@media not all{ /* светлая тема отключена: страница всегда тёмная, как и весь сайт */
  :root{
    --bg-1:#EAF6FF; --bg-2:#DCEEFC; --bg-3:#F3FAFF;
    --card: rgba(255,255,255,.55);
    --card-line: rgba(255,255,255,.75);
    --ink:#0B2333; --hint:#4E7690;
    --accent:#0A78A9; --accent-2:#0EA5E9;
    --btn-ink:#FFFFFF;
    --good:#1F7A4D; --warn:#B24A1E;
    --line: rgba(20,70,100,.12);
    --glass-shadow: 0 10px 30px rgba(20,90,130,.10);
    --blob-1: rgba(56,189,240,.35); --blob-2: rgba(14,165,233,.25); --blob-3: rgba(160,140,255,.18);
  }
}
*{box-sizing:border-box}
html{background:var(--bg-1)}
body{margin:0;min-height:100vh;color:var(--ink);position:relative;isolation:isolate;
     background:linear-gradient(165deg,var(--bg-1) 0%,var(--bg-2) 48%,var(--bg-3) 100%);
     font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     padding:14px 14px calc(24px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);pointer-events:none}
body::before{width:60vw;height:60vw;max-width:520px;max-height:520px;top:-18vw;right:-14vw;
             background:radial-gradient(circle at 30% 30%,var(--blob-1),transparent 70%)}
body::after{width:70vw;height:70vw;max-width:600px;max-height:600px;bottom:-22vw;left:-18vw;
            background:radial-gradient(circle at 60% 60%,var(--blob-2),transparent 70%)}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:700}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--card);
      backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
      border:1px solid var(--card-line);color:var(--hint);font-size:.76rem;font-weight:600}

.hero{background:var(--card);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:20px;padding:20px;margin-bottom:10px}
.hero .label{color:var(--hint);font-size:.8rem}
.hero .sum{font-size:2.3rem;font-weight:800;margin:2px 0 4px;letter-spacing:-.02em;
           background:linear-gradient(100deg,var(--ink),var(--accent));-webkit-background-clip:text;
           background-clip:text;-webkit-text-fill-color:transparent}
.hero .due{color:var(--hint);font-size:.86rem}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--card);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:16px;padding:12px 10px;text-align:center;min-width:0}
.tile b{display:block;font-size:1.25rem;font-weight:700}
.tile span{display:block;color:var(--hint);font-size:.72rem;margin-top:2px;line-height:1.3}

nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 1 auto;border:1px solid var(--card-line);border-radius:999px;padding:8px 10px;
           background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
           color:var(--hint);font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap;
           transition:background .15s ease,color .15s ease}
nav button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));
           color:var(--btn-ink);border-color:transparent;box-shadow:0 4px 16px rgba(56,189,240,.35)}

section{display:none}
section.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
     background:var(--card);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
     border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
     border-radius:14px;padding:12px 14px;margin-bottom:7px}
.row .l{min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .d{color:var(--hint);font-size:.78rem;margin-top:2px}
.row .a{font-weight:700;white-space:nowrap}
.st{font-size:.72rem;color:var(--hint)}
.st.on{color:var(--good)} .st.off{color:var(--warn)}

.card{background:var(--card);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:16px;padding:14px;margin-bottom:8px}
.card h3{font-size:.95rem;margin-bottom:6px}
.card p{margin:0;color:var(--hint);font-size:.88rem}

h3.sub{margin:18px 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;background:var(--card);backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--card-line);
      box-shadow:var(--glass-shadow);border-radius:16px;overflow:hidden;margin-bottom:8px}
th{padding:9px 12px;font-size:.72rem;color:var(--hint);text-align:left;font-weight:600;
   border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right}
td{padding:9px 12px;font-size:.86rem;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.n{font-weight:700;white-space:nowrap}
td.n.wait{color:var(--accent)} td.n.paid{color:var(--good)} td.n.warn{color:var(--warn)}

.note{background:var(--card);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
      border:1px solid var(--card-line);box-shadow:var(--glass-shadow);
      border-radius:16px;padding:14px;color:var(--hint);font-size:.86rem;margin-top:4px}
.empty{text-align:center;padding:40px 16px;color:var(--hint)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:8px}
.foot{margin-top:16px}
.foot button{width:100%;border:1px solid var(--card-line);border-radius:14px;padding:13px;
             background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
             color:var(--accent);font-size:.92rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app"><div class="empty"><b>Кабинет открывается из бота</b>
Зайди в @NIKSHEN_BOT, команда /admin, и нажми «Открыть кабинет».
<div id="diag" style="margin-top:18px;font-size:.72rem;opacity:.5;word-break:break-all"></div></div></div>

<script>
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function money(v){ return (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("ru-RU") + " ₽"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function decodePayload(raw){
  if (!raw) return null;
  try {
    var b = atob(decodeURIComponent(raw).replace(/-/g, "+").replace(/_/g, "/"));
    var bytes = Uint8Array.from(b, function(c){ return c.charCodeAt(0); });
    var data = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    return (data && data.v) ? data : null;
  } catch (e) { return null; }
}
function readData(){
  var fromQuery = decodePayload(new URLSearchParams(location.search).get("d"));
  if (fromQuery) return fromQuery;
  var h = location.hash.slice(1);
  if (!h) return null;
  var byKey = decodePayload(new URLSearchParams(h).get("d"));
  if (byKey) return byKey;
  return decodePayload(h.split("&")[0]);
}

var CHANNELS = {"sales-bot": "Бот-продажник · звёзды", "tribute": "Tribute",
  "numerolog-bot": "Бот-нумеролог · звёзды", "manual": "Услуги вручную"};
function chLabel(k){ return CHANNELS[k] || k; }

function tile(big, small, extra){
  return '<div class="tile"><b class="mono">' + esc(big) + '</b><span>' + esc(small)
       + (extra ? "<br>" + esc(extra) : "") + '</span></div>';
}
function tab(k, title){
  return '<button data-k="' + k + '" aria-selected="' + (k === "overview") + '">' + title + '</button>';
}

function render(d){
  var a = d.agg || {}, today = a.today || {}, week = a.week || {}, all = a.all || {};
  var h = '<header><h1>Кабинет владельца</h1><span class="chip">' + esc(d.gen || "") + '</span></header>'
        + '<div class="hero"><div class="label">Мои чистыми за всё время</div>'
        + '<div class="sum mono">' + money(all.mine || 0) + '</div>'
        + '<div class="due">выручка ' + money(all.gross || 0) + ' · ' + (all.cnt || 0) + ' '
        + plural(all.cnt || 0, "продажа", "продажи", "продаж") + '</div></div>'
        + '<div class="grid">'
        + tile(today.cnt || 0, "продаж сегодня", money(today.gross || 0))
        + tile(week.cnt || 0, "продаж за 7 дней", money(week.gross || 0))
        + tile(money((d.partners || {}).pending || 0), "партнёрам к выплате", "")
        + '</div>'
        + '<nav>' + tab("overview", "Обзор") + tab("partners", "Партнёры")
        + tab("sales", "Продажи") + tab("numerolog", "Нумеролог")
        + tab("priv", "Приват 18+") + tab("activity", "Активность") + '</nav>'
        + '<section id="s-overview" class="on">' + overviewHtml(d) + '</section>'
        + '<section id="s-partners">' + partnersHtml(d) + '</section>'
        + '<section id="s-sales">' + salesHtml(d) + '</section>'
        + '<section id="s-numerolog">' + numerologHtml(d) + '</section>'
        + '<section id="s-priv">' + privHtml(d) + '</section>'
        + '<section id="s-activity">' + activityHtml(d) + '</section>'
        + '<div class="foot"><button id="refresh">Обновить</button></div>';
  document.getElementById("app").innerHTML = h;

  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll("nav button").forEach(function(x){ x.setAttribute("aria-selected", "false"); });
      document.querySelectorAll("section").forEach(function(x){ x.classList.remove("on"); });
      b.setAttribute("aria-selected", "true");
      document.getElementById("s-" + b.dataset.k).classList.add("on");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    };
  });
  document.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick = function(){
      var u = b.dataset.open;
      if (tg && tg.openLink) tg.openLink(u); else location.href = u;
    };
  });
  document.getElementById("refresh").onclick = function(){
    // Цифры лежат в адресе, а не тянутся с сервера: свежие берём заново
    // командой /admin в боте, эта кнопка просто закрывает окно к ней.
    if (tg && tg.close) tg.close(); else location.reload();
  };
}

function plural(n, one, few, many){
  var x = Math.abs(n) % 100, b = x % 10;
  if (x > 10 && x < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function overviewHtml(d){
  var f = d.funnel || [], u = d.users || {};
  var rows = f.map(function(s){
    return '<tr><td>' + esc(s.l) + '</td><td class="n mono">' + s.today + '</td>'
         + '<td class="n mono">' + s.week + '</td><td class="n mono">' + s.month + '</td>'
         + '<td class="n mono">' + s.all + '</td></tr>';
  }).join("");
  return '<h3 class="sub">Воронка бота (уникальные люди)</h3>'
       + '<table><tr><th>Шаг</th><th class="n">Сегодня</th><th class="n">7 дней</th>'
       + '<th class="n">30 дней</th><th class="n">Всего</th></tr>' + rows + '</table>'
       + '<h3 class="sub">База</h3>'
       + '<div class="grid">'
       + tile(u.total || 0, "всего в базе", "")
       + tile(u.guides || 0, "забрали гайд", "")
       + tile(u.questions || 0, "вопросов ИИ", "")
       + '</div><div class="grid">'
       + tile(u.escalated || 0, "передано тебе", "")
       + tile(u.leads || 0, "заявок на услуги", "")
       + tile(u.reviews || 0, "отзывов", "")
       + '</div>'
       + '<div class="note">Воронка и лента активности считаются только по @NIKSHEN_BOT — '
       + 'у бота-нумеролога эти шаги не размечены. Его профили и разборы — во вкладке '
       + '«Нумеролог», приватный канал — во вкладке «Приват 18+».</div>';
}

function partnersHtml(d){
  var p = d.partners || {}, rows = p.rows || [];
  var h = '<div class="grid">'
        + tile(p.active || 0, "активных партнёров", (p.total || 0) + " всего")
        + tile(p.ref || 0, "приведено людей", "")
        + tile(money(p.pending || 0), "к выплате всего", "")
        + '</div>';
  if (!rows.length) {
    return h + '<div class="note">Промокодов пока нет — заведи в promo_codes.json.</div>';
  }
  h += '<table><tr><th>Партнёр</th><th class="n">Привёл</th><th class="n">Продаж</th>'
     + '<th class="n">К выплате</th></tr>'
     + rows.map(function(r){
         var cls = r.pend < 0 ? "warn" : (r.pend > 0 ? "wait" : "");
         var status = r.own ? "свой код" : (r.active ? (r.open ? "кабинет открыт" : "кабинет не открыт")
                     : "выключен");
         return '<tr><td>' + esc(r.n) + '<br><span class="st ' + (r.active ? "on" : "off") + '">'
              + esc(r.who) + ' · ' + esc(status) + '</span></td>'
              + '<td class="n mono">' + r.ref + '</td><td class="n mono">' + r.cnt + '</td>'
              + '<td class="n mono ' + cls + '">' + money(r.pend) + '</td></tr>';
       }).join("") + '</table>'
     + '<div class="note">Начислено всего: ' + money(p.accrued || 0) + ' · выплачено: '
     + money(p.paid || 0) + '. Отметить выплату — <code>/payout КОД</code> в боте.</div>';
  return h;
}

function salesHtml(d){
  var s = d.sales || {}, ch = s.by_channel || [], top = s.top || [], recent = s.recent || [];
  var h = "";
  if (ch.length) {
    h += '<h3 class="sub">По каналам</h3><table><tr><th>Канал</th><th class="n">Продаж</th>'
       + '<th class="n">Выручка</th></tr>'
       + ch.map(function(r){
           return '<tr><td>' + esc(chLabel(r[0])) + '</td><td class="n mono">' + r[1]
                + '</td><td class="n mono">' + money(r[2]) + '</td></tr>';
         }).join("") + '</table>';
  }
  if (top.length) {
    h += '<h3 class="sub">Топ продуктов</h3><table><tr><th>Продукт</th><th class="n">Продаж</th>'
       + '<th class="n">Выручка</th></tr>'
       + top.map(function(r){
           return '<tr><td>' + esc(r[0]) + '</td><td class="n mono">' + r[1]
                + '</td><td class="n mono">' + money(r[2]) + '</td></tr>';
         }).join("") + '</table>';
  }
  h += '<h3 class="sub">Последние продажи</h3>';
  if (!recent.length) {
    h += '<div class="note">Продаж пока нет.</div>';
  } else {
    h += recent.map(function(r){
      return '<div class="row"><div class="l"><div class="t">' + esc(r.t) + '</div>'
           + '<div class="d">' + esc(r.d) + ' · ' + esc(chLabel(r.ch))
           + ' · код ' + esc(r.code) + '</div></div>'
           + '<div class="a mono">' + money(r.a) + '</div></div>';
    }).join("");
  }
  return h;
}

function numerologHtml(d){
  var n = d.numerolog || {}, rows = n.readings || [];
  var total = rows.reduce(function(s, r){ return s + r[1]; }, 0);
  var h = '<div class="grid">'
        + tile(n.profiles || 0, "профилей в базе", "")
        + tile(total, "разборов выдано", "")
        + tile(n.reviews || 0, "отзывов", "")
        + '</div>';
  if (rows.length) {
    h += '<h3 class="sub">Разборы по типам</h3><table><tr><th>Тип</th><th class="n">Выдано</th></tr>'
       + rows.map(function(r){
           return '<tr><td>' + esc(r[0]) + '</td><td class="n mono">' + r[1] + '</td></tr>';
         }).join("") + '</table>';
  }
  return h + '<div class="note">Выручка и продажи разборов уже входят в раздел «Продажи» '
       + '(канал «Бот-нумеролог · звёзды»). Здесь — только сам продукт: сколько профилей '
       + 'завели и что именно выдал бот. Тип разбора — техническое имя из истории бота, не название карточки.</div>';
}

function privHtml(d){
  var p = d.priv || {};
  var h = '<div class="grid">'
        + tile(p.subs || 0, "оформили подписку", "на " + esc(p.date || "—"))
        + tile(p.active || 0, "активны сейчас", "")
        + tile(p.cancelled || 0, "отключили автопродление", "")
        + '</div>'
        + '<div class="note"><b style="display:block;color:var(--ink);margin-bottom:4px">'
        + 'Это не живые цифры.</b>Приватный канал продаётся напрямую через Tribute, мимо '
        + 'обоих ботов, а Tribute не отдаёт список подписчиков через API — только владелец '
        + 'видит это в своём кабинете. Числа выше — последний снимок на ' + esc(p.date || "—")
        + ', вбитый руками в content.py. За актуальными цифрами — сюда:</div>'
        + linkCard("Кабинет Tribute", "Живые подписки, отключения, доход.", p.tribute_url)
        + linkCard("Буферная страница", "Клики на вход в канал — в Яндекс.Метрике по целям "
                  + "priv_18_yes / priv_click_tg / priv_click_web.", p.page_url);
  return h;
}
function linkCard(title, desc, url){
  return '<div class="card" data-open="' + esc(url) + '" style="cursor:pointer">'
       + '<h3>' + esc(title) + ' →</h3><p>' + esc(desc) + '</p></div>';
}

function activityHtml(d){
  var act = d.activity || [];
  if (!act.length) return '<div class="note">Событий пока нет.</div>';
  return act.map(function(e){
    return '<div class="row"><div class="l"><div class="t">' + esc(e.who) + '</div>'
         + '<div class="d">' + esc(e.ev) + '</div></div>'
         + '<div class="a" style="font-size:.76rem;color:var(--hint);font-weight:600">'
         + esc(e.t) + '</div></div>';
  }).join("") + '<div class="note">Последние ' + act.length + ' событий из @NIKSHEN_BOT.</div>';
}

var data = readData();
if (!data) {
  var diag = document.getElementById("diag");
  if (diag) diag.textContent = "адрес: " + (location.search ? "параметры есть (" + location.search.length
      + " знаков)" : "параметров нет") + " · фрагмент: "
      + (location.hash ? location.hash.slice(1, 60) + "…" : "пуст");
}
if (data) { try { render(data); } catch (e) {
  document.getElementById("app").innerHTML =
    '<div class="empty"><b>Не смог показать данные</b>Открой кабинет из бота заново: /admin</div>'; } }
</script>
</body>
</html>
